<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioFit & Care - Workout Logger</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        label { font-weight: bold; }
        select, input, button { width: 100%; padding: 8px; margin: 8px 0 16px 0; box-sizing: border-box; }
        button { background-color: #0284c7; color: white; border: none; font-size: 16px; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>CardioFit & Care - Log Workout</h2>
    <form id="workoutForm">
        <label for="workout">Workout Type:</label>
        <select id="workout">
            <option value="Walking">Walking</option>
            <option value="Cycling">Cycling</option>
            <option value="Light Aerobics">Light Aerobics</option>
            <option value="Water Aerobics">Water Aerobics</option>
        </select>

        <label for="duration">Duration (minutes):</label>
        <input type="number" id="duration" min="1" placeholder="e.g. 20">

        <label for="rpe">Rating of Perceived Exertion (RPE 1-10):</label>
        <input type="number" id="rpe" min="1" max="10" placeholder="e.g. 4">

        <button type="submit">Log Workout</button>
    </form>
</body>
</html>
