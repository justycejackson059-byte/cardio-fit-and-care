<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioFit & Care - Workout Logger</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #0284c7;
            margin: 0 0 6px 0;
            font-size: 22px;
        }
        .header p {
            margin: 0;
            color: #64748b;
            font-size: 13px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>CardioFit & Care</h1>
            <p>Low-Impact Exercise & RPE Tracking Prototype</p>
        </div>

        <form id="workoutForm">
            <div class="form-group">
                <label for="workout">Exercise Type</label>
                <select id="workout" required>
                    <option value="Walking">Walking</option>
                    <option value="Cycling">Cycling</option>
                    <option value="Light Aerobics">Light Aerobics</option>
                    <option value="Water Aerobics">Water Aerobics</option>
                    <option value="Stretching / Mobility">Stretching / Mobility</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duration">Duration (minutes)</label>
                <input type="number" id="duration" min="1" max="300" placeholder="e.g. 20" required>
            </div>

            <div class="form-group">
                <label for="rpe">Rating of Perceived Exertion (RPE 1–10)</label>
                <input type="number" id="rpe" min="1" max="10" placeholder="e.g. 4" required>
            </div>

            <button type="submit">Log Workout Entry</button>
        </form>
    </div>
</body>
</html>
