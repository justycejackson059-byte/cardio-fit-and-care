<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioFit & Care - Workout Logger</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 550px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            color: var(--primary);
            margin: 0 0 8px 0;
            font-size: 24px;
        }
        .header p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fff;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .logs-header h3 {
            margin: 0;
            font-size: 18px;
        }
        .log-item {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .log-info h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: var(--text);
        }
        .log-info p {
            margin: 0;
            font-size: 13px;
            color: #64748b;
        }
        .rpe-badge {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 6px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
        }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 20px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>CardioFit & Care</h1>
            <p>Low-Impact Exercise & RPE Tracking Prototype</p>
        </div>

        <div class="card">
            <form id="workoutForm">
                <div class="form-group">
                    <label for="workout">Exercise Type</label>
                    <select id="workout" required>
                        <option value="Walking">Walking</option>
                        <option value="Cycling">Cycling</option>
                        <option value="Light Aerobics">Light Aerobics</option>
                        <option value="Water Aerobics">Water Aerobics</option>
                        <option value="Stretching / Mobility">Stretching / Mobility</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="duration">Duration (minutes)</label>
                    <input type="number" id="duration" min="1" max="300" placeholder="e.g. 20" required>
                </div>

                <div class="form-group">
                    <label for="rpe">Rating of Perceived Exertion (RPE 1–10)</label>
                    <input type="number" id="rpe" min="1" max="10" placeholder="e.g. 4" required>
                </div>

                <button type="submit">Log Workout Entry</button>
            </form>
        </div>

        <div class="logs-header">
            <h3>Recent Logged Workouts</h3>
        </div>

        <div id="workoutLogs">
            <div class="empty-state">No workout entries recorded yet.</div>
        </div>
    </div>

    <script>
        const workoutForm = document.getElementById('workoutForm');
        const workoutLogs = document.getElementById('workoutLogs');
        let logs = [];

        workoutForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const workout = document.getElementById('workout').value;
            const duration = document.getElementById('duration').value;
            const rpe = document.getElementById('rpe').value;
            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newLog = { workout, duration, rpe, timestamp };
            logs.unshift(newLog);

            renderLogs();
            workoutForm.reset();
        });

        function renderLogs() {
            if (logs.length === 0) {
                workoutLogs.innerHTML = '<div class="empty-state">No workout entries recorded yet.</div>';
                return;
            }

            workoutLogs.innerHTML = logs.map(log => `
                <div class="log-item">
                    <div class="log-info">
                        <h4>${log.workout}</h4>
                        <p>${log.duration} mins • Logged at ${log.timestamp}</p>
                    </div>
                    <div class="rpe-badge">
                        RPE ${log.rpe}/10
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
